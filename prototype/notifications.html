<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyOpus · 通知中心原型</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="feature-prototype.css">
<style>
.notif-wrap{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
.bell{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.badge{min-width:18px;height:18px;border-radius:999px;background:var(--red);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 5px}
.noteitem{display:flex;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line)}
.noteitem.unread{background:var(--primary-soft)}
.noteitem .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);margin-top:6px;flex:0 0 auto}
.noteitem.read .dot{background:transparent}
.noteitem .t{font-size:12.5px;font-weight:600}
.noteitem .d{font-size:11.5px;color:var(--text-3);margin-top:2px;line-height:1.45}
.noteitem .a{margin-left:auto;display:flex;gap:4px;align-items:flex-start}
.perm{border:1px solid var(--amber-border);background:var(--amber-soft);color:var(--amber);border-radius:9px;padding:9px 11px;font-size:11.5px;margin:10px 12px}
.perm.denied{border-color:var(--red-border);background:var(--red-soft);color:var(--red)}
.emptybox{padding:44px 20px;text-align:center;color:var(--text-3);font-size:12.5px}
</style>
</head>
<body>
<div class="proto">
  <div class="proto-head"><div><h1>通知中心 · 站内 + 系统通知</h1><p>Attention 需要决策；Notification 只告知。站内为真相，系统通知失败不丢。</p></div></div>
  <div class="proto-tabs" id="tabs">
    <button class="proto-tab on" data-s="unread">有未读</button>
    <button class="proto-tab" data-s="read">全部已读</button>
    <button class="proto-tab" data-s="denied">通知权限被拒</button>
    <button class="proto-tab" data-s="empty">空</button>
  </div>

  <div class="notif-wrap">
    <div class="panel" style="padding:18px">
      <div style="font-size:13px;font-weight:650;margin-bottom:8px">说明</div>
      <div class="note">铃铛入口显示未读数；单条已读与全部已读都幂等。系统通知权限被拒时只降级站内，不丢通知；点击通知跳到关联任务/工单。</div>
      <div style="margin-top:14px"><button class="btn primary" onclick="alert('模拟：去处理审批')">去处理审批</button></div>
    </div>
    <div class="panel">
      <div class="bell">🔔 通知 <span class="badge" id="badge">3</span><span class="spacer"></span><button class="link-btn" id="all">全部已读</button></div>
      <div id="perm"></div>
      <div id="list"></div>
      <div style="padding:8px 12px;border-top:1px solid var(--line)"><button class="btn" style="width:100%">查看全部</button></div>
    </div>
  </div>

  <p class="footer-note">通知按用户隔离；dedupe_key 去重；已读通知按 TTL 清理；不把通知塞进 Attention。</p>
</div>
<script>
const notes=[
  {id:'nt1',kind:'task',title:'任务 #tk_01J8K3 已完成',desc:'auth.ts 已更新，测试通过·2 个产物',link:'任务详情',read:false},
  {id:'nt2',kind:'cloud',title:'云操作完成：重启 cvm-04',desc:'status=succeeded·耗时 42s',link:'查看 cloud_ops',read:false},
  {id:'nt3',kind:'export',title:'导出完成：audit-2026-11.csv',desc:'12,480 行·有效期 24h',link:'下载',read:false},
  {id:'nt4',kind:'system',title:'版本 0.9.2 可用',desc:'修复队列租约与通知去重',link:'更新说明',read:true}
];
let scene='unread';
function render(){
  const visible=scene==='empty'?[]:notes;
  document.getElementById('badge').textContent=visible.filter(n=>!n.read).length;
  document.getElementById('badge').style.display=visible.filter(n=>!n.read).length?'grid':'none';
  document.getElementById('perm').innerHTML=scene==='denied'?`<div class="perm denied">系统通知权限被拒绝 · 已降级为站内通知，不影响接收。<button class="link-btn" style="color:var(--red)">去开启</button></div>`:(scene==='empty'?'':`<div class="perm">系统通知已授权 · 后台任务完成会发系统通知<button class="link-btn" style="color:var(--amber)">关闭</button></div>`);
  document.getElementById('list').innerHTML=visible.length?visible.map(n=>`
    <div class="noteitem ${n.read?'read':'unread'}">
      <div class="dot"></div>
      <div style="min-width:0"><div class="t">${n.title}</div><div class="d">${n.desc}</div><div style="margin-top:4px"><span class="chip">${n.kind}</span></div></div>
      <div class="a">${n.read?'<span class="chip">已读</span>':`<button class="btn" data-read="${n.id}">已读</button>`}<button class="btn">${n.link}</button></div>
    </div>`).join(''):`<div class="emptybox">暂无通知</div>`;
  document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{const n=notes.find(x=>x.id===b.dataset.read);if(n){n.read=true;render();}});
  document.querySelectorAll('.proto-tab').forEach(b=>b.classList.toggle('on',b.dataset.s===scene));
}
document.getElementById('all').onclick=()=>{notes.forEach(n=>n.read=true);render();};
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b){scene=b.dataset.s;render();}});
render();
</script>
</body>
</html>
