name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Full gate (lint / type / imports / schema / tests / contracts)
        run: uv run python scripts/check.py

      - name: Crash-recovery e2e stability (3 runs)
        run: |
          for i in 1 2 3; do
            uv run pytest tests/e2e/test_kill9.py -q
          done
