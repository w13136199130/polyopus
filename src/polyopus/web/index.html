<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PolyOpus</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#fafafa; --surface-3:#f0f2f5;
  --text:#1a1d24; --text-2:#5c6470; --text-3:#9aa3af;
  --line:#e4e7ec; --accent:#4f6ef7; --accent-2:#3d5be0;
  --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
  --radius:10px; --font:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--surface:#171a21;--surface-2:#1c2029;--surface-3:#232833;
    --text:#e6e9ef;--text-2:#9aa3af;--text-3:#6b7280;--line:#2a2f3a}
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);height:100vh;display:flex}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:8px 14px;font-size:13px}
input,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
/* ---- login ---- */
.login{margin:auto;width:340px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
.login h1{margin:0;font-size:18px;text-align:center}
.login .sub{color:var(--text-3);text-align:center;font-size:12px;margin-top:-6px}
.login button{background:var(--accent);color:#fff}
.login .err{color:var(--danger);font-size:12px;min-height:16px}
/* ---- shell ---- */
.shell{display:none;flex:1;min-width:0}
.rail{width:250px;flex:none;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}
.rail header{padding:14px 14px 8px;display:flex;justify-content:space-between;align-items:center}
.rail header b{font-size:15px}
.rail .new{background:var(--surface-3);color:var(--text);padding:5px 10px;font-size:12px}
.threads{flex:1;overflow:auto;padding:6px}
.thread{padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread:hover{background:var(--surface-3)}
.thread.on{background:var(--surface-3);color:var(--text);font-weight:600}
.rail footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--text-3);font-size:12px}
.rail footer button{background:none;color:var(--text-3);padding:4px 6px}
/* ---- chat ---- */
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
.msgs{flex:1;overflow:auto;padding:20px 8%;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:10px 14px;border-radius:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.assistant.streaming::after{content:"▋";animation:blink 1s steps(2) infinite;color:var(--text-3)}
@keyframes blink{50%{opacity:0}}
.empty{margin:auto;color:var(--text-3);text-align:center;line-height:2}
/* ---- approval card ---- */
.card{align-self:flex-start;width:78%;background:var(--surface);border:1px solid var(--warn);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.card .t{display:flex;gap:8px;align-items:center;color:var(--warn);font-weight:600}
.card .risk{font-size:11px;background:var(--warn);color:#fff;border-radius:6px;padding:1px 6px}
.card .tool{font-family:ui-monospace,Consolas,monospace;background:var(--surface-3);border-radius:6px;padding:8px;font-size:12px;white-space:pre-wrap;word-break:break-all}
.card .ops{display:flex;gap:8px}
.card .ops .yes{background:var(--ok);color:#fff}
.card .ops .no{background:var(--surface-3);color:var(--text)}
.card.done{border-color:var(--line);opacity:.75}
.card.done .t{color:var(--text-3)}
.hint{align-self:center;color:var(--text-3);font-size:12px}
/* ---- composer ---- */
.composer{border-top:1px solid var(--line);background:var(--surface);padding:14px 8%}
.composer .row{display:flex;gap:10px}
.composer textarea{flex:1;resize:none;height:44px;max-height:120px}
.composer .send{background:var(--accent);color:#fff;width:52px}
.composer .send:disabled{opacity:.4;cursor:default}
.composer .meta{color:var(--text-3);font-size:11px;margin-top:6px;min-height:14px}
/* ---- view switch ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.viewbar{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.viewbar .tab{background:none;color:var(--text-2);padding:6px 12px;font-size:13px}
.viewbar .tab.on{background:var(--surface-3);color:var(--text);font-weight:600}
.badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--warn);color:#fff;font-size:11px}
.badge:empty{display:none}
/* ---- tasks ---- */
.tasks{flex:1;overflow:auto;padding:16px 6%;display:flex;flex-direction:column;gap:18px}
.tasks h3{margin:0 0 8px;font-size:13px;color:var(--text-2)}
.tasks .count{color:var(--warn)}
.cards{display:flex;flex-direction:column;gap:8px}
.inbox-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;padding:10px 12px}
.inbox-card .t{font-weight:600;margin-bottom:4px}
.inbox-card .d{color:var(--text-2);font-size:12px;margin-bottom:8px}
.inbox-card .ops{display:flex;gap:8px}
.inbox-card .ops button{padding:5px 12px;font-size:12px}
.inbox-card .yes{background:var(--ok);color:#fff}
.inbox-card .no{background:var(--surface-3);color:var(--text)}
.buckets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.bucket h4{margin:0 0 6px;font-size:12px;color:var(--text-3)}
.bucket h4 b{color:var(--text)}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.tk:hover{border-color:var(--accent)}
.tk .title{font-size:13px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .meta{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--text-3)}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 4px}
.tag.explicit{color:var(--ok);border-color:var(--ok)}
.tk .stop{float:right;background:none;color:var(--danger);font-size:11px;padding:2px 6px}
.empty.small{font-size:12px;color:var(--text-3);padding:8px}
.debug{border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.debug .row{display:flex;gap:8px}
.detail{position:fixed;right:16px;top:70px;width:360px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:30}
.detail h4{margin:0 0 8px}
.detail .kv{font-size:12px;color:var(--text-2);margin-bottom:4px}
.detail .close{position:absolute;right:8px;top:8px;background:none;color:var(--text-3)}
</style>
</head>
<body>
<div class="login" id="login">
  <h1>PolyOpus</h1>
  <div class="sub">切片① · 对话与审批</div>
  <input id="u" placeholder="用户名" autocomplete="username" />
  <input id="p" type="password" placeholder="密码" autocomplete="current-password" />
  <div class="err" id="lerr"></div>
  <button id="loginBtn">登录</button>
</div>

<div class="shell" id="shell">
  <div class="rail">
    <header><b>会话</b><button class="new" id="newThread">＋ 新建</button></header>
    <div class="threads" id="threads"></div>
    <footer><span id="who"></span><button id="logout" title="退出">⎋</button></footer>
  </div>
  <div class="main" id="chatView">
    <div class="viewbar">
      <button class="tab on" id="tabChat">对话</button>
      <button class="tab" id="tabTasks">任务 <span class="badge" id="taskBadge"></span></button>
    </div>
    <div class="chat">
      <div class="msgs" id="msgs"><div class="empty">发一条消息开始<br/>消息里包含「写 / 删除 / write」会触发审批</div></div>
      <div class="composer">
        <div class="row">
          <textarea id="input" placeholder="输入消息，Enter 发送"></textarea>
          <button class="send" id="send">➤</button>
        </div>
        <div class="meta" id="meta"></div>
      </div>
    </div>
  </div>
  <div class="main" id="tasksView" style="display:none">
    <div class="viewbar">
      <button class="tab" id="tabChat2">对话</button>
      <button class="tab on" id="tabTasks2">任务 <span class="badge" id="taskBadge2"></span></button>
    </div>
    <div class="tasks">
      <section>
        <h3>收件箱 <span class="count" id="inboxCount"></span></h3>
        <div id="inbox" class="cards"></div>
        <div class="empty small" id="inboxEmpty" style="display:none">没有待决事项</div>
      </section>
      <section>
        <h3>工单</h3>
        <div id="buckets" class="buckets"></div>
      </section>
      <section class="debug">
        <h3>演示：webhook 触发器</h3>
        <div class="row">
          <input id="triggerText" style="flex:1" placeholder="消息内容（含 /polyopus 会建工单）" />
          <button id="sendTrigger">发送触发</button>
        </div>
        <div class="meta" id="triggerMeta"></div>
      </section>
    </div>
    <div class="detail" id="ticketDetail" style="display:none"></div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { threadId: null, lastSeq: 0, es: null, user: null, streaming: null };

const api = async (path, opts = {}) => {
  const { headers, ...rest } = opts;
  const res = await fetch("/api/v1" + path, {
    ...rest,
    // spread order matters: merging after rest so callers cannot drop Content-Type
    headers: { "Content-Type": "application/json", ...(headers || {}) },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error?.code || res.status),
    { code: body.error?.code, message: body.error?.message });
  return body;
};

/* ---- auth ---- */
async function boot() {
  try { const me = await api("/auth/me"); enter(me.user); }
  catch { $("login").style.display = "flex"; }
}
async function doLogin() {
  $("lerr").textContent = "";
  try {
    const r = await api("/auth/login", { method: "POST",
      body: JSON.stringify({ username: $("u").value, password: $("p").value }) });
    enter(r.user);
  } catch (e) { $("lerr").textContent = e.message || e.code || "登录失败"; }
}
function enter(user) {
  state.user = user;
  $("login").style.display = "none";
  $("shell").style.display = "flex";
  $("who").textContent = user.username;
  loadThreads();
}
async function doLogout() {
  try { await api("/auth/logout", { method: "POST" }); } catch {}
  location.reload();
}

/* ---- threads ---- */
async function loadThreads() {
  const { items } = await api("/threads");
  const box = $("threads"); box.innerHTML = "";
  for (const t of items) {
    const el = document.createElement("div");
    el.className = "thread" + (t.threadId === state.threadId ? " on" : "");
    el.textContent = t.title; el.title = t.title;
    el.onclick = () => openThread(t.threadId);
    box.appendChild(el);
  }
  if (!state.threadId && items.length) openThread(items[0].threadId);
}
async function newThread() {
  const t = await api("/threads", { method: "POST", body: JSON.stringify({ title: "新对话" }) });
  state.threadId = null; await loadThreads(); openThread(t.threadId);
}

/* ---- chat ---- */
async function openThread(threadId) {
  state.threadId = threadId; state.lastSeq = 0;
  if (state.es) state.es.close();
  document.querySelectorAll(".thread").forEach(el =>
    el.classList.toggle("on", el.textContent && el.onclick));
  const msgs = $("msgs"); msgs.innerHTML = "";
  const { items } = await api(`/threads/${threadId}/messages`);
  for (const m of items) addBubble(m.role, m.content, m.status);
  loadThreads();
  follow();
}
function follow() {
  state.es = new EventSource(
    `/api/v1/threads/${state.threadId}/events?after_seq=${state.lastSeq}&follow=true`);
  state.es.onmessage = (e) => handle(JSON.parse(e.data));
  state.es.onerror = () => { /* browser retries; after_seq resumes */ };
}
function addBubble(role, content, status) {
  const el = document.createElement("div");
  el.className = `msg ${role}` + (status === "streaming" ? " streaming" : "");
  el.textContent = content;
  $("msgs").appendChild(el);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return el;
}
function hint(text) {
  const el = document.createElement("div"); el.className = "hint"; el.textContent = text;
  $("msgs").appendChild(el); $("msgs").scrollTop = $("msgs").scrollHeight;
}

/* ---- stream state machine (docs/33 §5.2.1, simplified) ---- */
function handle(ev) {
  state.lastSeq = ev.seq;
  const p = ev.payload;
  switch (ev.type) {
    case "message.delta": {
      if (!state.streaming) {
        const el = addBubble("assistant", "", "streaming");
        state.streaming = { el, text: "" };
      }
      state.streaming.text += p.text;
      state.streaming.el.textContent = state.streaming.text;
      $("msgs").scrollTop = $("msgs").scrollHeight;
      break;
    }
    case "message.started": {
      state.streaming = { el: addBubble("assistant", "", "streaming"), text: "" };
      break;
    }
    case "message.completed": {
      if (state.streaming) {
        state.streaming.el.classList.remove("streaming");
        state.streaming.el.textContent =
          (p.blocks || []).filter(b => b.type === "text").map(b => b.text).join("");
        state.streaming = null;
      }
      break;
    }
    case "approval.requested": {
      renderApproval(p); setMeta("等待审批…"); break;
    }
    case "approval.resolved": {
      const card = document.querySelector(`[data-approval="${p.approval_id}"]`);
      if (card) {
        card.classList.add("done");
        const t = card.querySelector(".t");
        t.textContent = p.decision === "denied" ? "✕ 已拒绝" :
          p.decision === "expired" ? "⏱ 已过期（自动拒绝）" : "✓ 已批准";
        card.querySelector(".ops").remove();
      }
      break;
    }
    case "turn.finished": {
      setMeta(p.status === "completed" ? "完成" : `结束：${p.status}`);
      $("send").disabled = false; $("input").disabled = false;
      break;
    }
    case "turn.started": setMeta("生成中…"); break;
    case "turn.resumed": hint(`↻ 从第 ${p.from_step} 步恢复（${p.reason}）`); break;
  }
}
function setMeta(t) { $("meta").textContent = t; }

/* ---- approval card ---- */
function renderApproval(p) {
  const action = (p.actions || [])[0] || {};
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.approval = p.approval_id;
  card.innerHTML = `
    <div class="t"><span class="risk">${action.risk || "high"}</span> 需要审批 · ${p.summary || action.tool || ""}</div>
    <div class="tool">${action.tool || "tool"}\n${action.args_preview || ""}</div>
    <div class="ops">
      <button class="yes">批准</button><button class="no">拒绝</button>
    </div>`;
  card.querySelector(".yes").onclick = () => answer(card, p.approval_id, "approve");
  card.querySelector(".no").onclick = () => answer(card, p.approval_id, "deny");
  $("msgs").appendChild(card); $("msgs").scrollTop = $("msgs").scrollHeight;
}
async function answer(card, approvalId, decision) {
  card.querySelector(".ops").disabled = true;
  try {
    const { items } = await api("/attentions");
    const at = items.find(i => i.sourceId === approvalId && i.status === "pending");
    if (!at) throw new Error("待决项已不存在");
    await api(`/attentions/${at.attentionId}/answer`, {
      method: "POST", body: JSON.stringify({ decision }) });
    /* approval.resolved event updates the card */
  } catch (e) {
    setMeta("操作失败：" + (e.code || e.message));
    card.querySelector(".ops").disabled = false;
  }
}

/* ---- send ---- */
async function send() {
  const content = $("input").value.trim();
  if (!content || !state.threadId) return;
  $("input").value = "";
  addBubble("user", content, "completed");
  $("send").disabled = true; $("input").disabled = true;
  setMeta("发送中…");
  try {
    await api(`/threads/${state.threadId}/turns`, {
      method: "POST",
      headers: { "Idempotency-Key": crypto.randomUUID() },
      body: JSON.stringify({ content }),
    });
  } catch (e) {
    setMeta("发送失败：" + (e.code || e.message));
    $("send").disabled = false; $("input").disabled = false;
  }
}

$("loginBtn").onclick = doLogin;
$("p").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("logout").onclick = doLogout;
$("newThread").onclick = newThread;
$("send").onclick = send;
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
/* ---- tasks view ---- */
const BUCKETS = [
  ["attention", "待决"], ["running", "进行中"], ["queued", "排队"], ["done", "完成"],
];
let taskTimer = null;
let demoSourceId = null;

function switchView(which) {
  $("chatView").style.display = which === "chat" ? "flex" : "none";
  $("tasksView").style.display = which === "tasks" ? "flex" : "none";
  for (const id of ["tabChat", "tabChat2"]) $(id).classList.toggle("on", which === "chat");
  for (const id of ["tabTasks", "tabTasks2"]) $(id).classList.toggle("on", which === "tasks");
  clearInterval(taskTimer);
  if (which === "tasks") { refreshTasks(); taskTimer = setInterval(refreshTasks, 3000); }
}
for (const [a, b] of [["tabChat", "chat"], ["tabChat2", "chat"], ["tabTasks", "tasks"], ["tabTasks2", "tasks"]])
  $(a).onclick = () => switchView(b);

async function refreshTasks() {
  try {
    const inbox = (await api("/attentions")).items;
    renderInbox(inbox);
    const tickets = (await api("/tickets")).items;
    renderTickets(tickets);
    const pending = inbox.filter(i => i.status === "pending").length;
    $("taskBadge").textContent = pending || "";
    $("taskBadge2").textContent = pending || "";
  } catch (e) { /* polling errors keep last render */ }
}

function renderInbox(items) {
  const box = $("inbox"); box.innerHTML = "";
  const pending = items.filter(i => i.status === "pending");
  $("inboxCount").textContent = pending.length || "";
  $("inboxEmpty").style.display = pending.length ? "none" : "block";
  for (const item of pending) {
    const el = document.createElement("div");
    el.className = "inbox-card";
    const isApproval = item.kind === "approval";
    el.innerHTML = `
      <div class="t">${item.kind === "approval" ? "需要审批" : item.kind === "blocked" ? "被阻塞" : "待回答"} · ${esc((item.payload && item.payload.summary) || item.kind)}</div>
      <div class="d">${isApproval ? "来源：工具调用" : item.ticketId ? "工单：" + item.ticketId : ""}</div>
      <div class="ops">${isApproval
        ? '<button class="yes">批准</button><button class="no">拒绝</button>'
        : '<span class="empty small">请在对话中处理</span>'}</div>`;
    if (isApproval) {
      const [yes, no] = el.querySelectorAll("button");
      yes.onclick = () => answerAttention(item.attentionId, "approve", el);
      no.onclick = () => answerAttention(item.attentionId, "deny", el);
    }
    box.appendChild(el);
  }
}

async function answerAttention(id, decision, card) {
  card.querySelectorAll("button").forEach(b => b.disabled = true);
  try {
    await api(`/attentions/${id}/answer`, { method: "POST", body: JSON.stringify({ decision }) });
    refreshTasks();
  } catch (e) { card.querySelectorAll("button").forEach(b => b.disabled = false); }
}

function renderTickets(tickets) {
  const wrap = $("buckets"); wrap.innerHTML = "";
  for (const [key, label] of BUCKETS) {
    const group = tickets.filter(t => t.bucket === key && t.state === "open" || (key === "done" && t.bucket === "done"));
    const col = document.createElement("div");
    col.className = "bucket";
    col.innerHTML = `<h4>${label} <b>${group.length}</b></h4>`;
    for (const t of group.slice(0, 20)) {
      const el = document.createElement("div");
      el.className = "tk";
      el.innerHTML = `
        ${t.state === "open" && t.bucket !== "done" ? '<button class="stop">停止</button>' : ""}
        <div class="title">${esc(t.title || t.ticketId)}</div>
        <div class="meta"><span class="tag ${t.strength}">${t.strength}</span><span>${shortId(t.ticketId)}</span></div>`;
      el.onclick = (ev) => { if (!ev.target.classList.contains("stop")) showTicket(t.ticketId); };
      const stop = el.querySelector(".stop");
      if (stop) stop.onclick = async (ev) => {
        ev.stopPropagation();
        if (!confirm("停止该工单？进行中的执行将被取消。")) return;
        stop.disabled = true;
        try { await api(`/tickets/${t.ticketId}/stop`, { method: "POST" }); refreshTasks(); }
        catch (e) { stop.disabled = false; }
      };
      col.appendChild(el);
    }
    wrap.appendChild(col);
  }
}

async function showTicket(id) {
  try {
    const d = await api(`/tickets/${id}`);
    const box = $("ticketDetail");
    box.innerHTML = `
      <button class="close">✕</button>
      <h4>${esc(d.title)}</h4>
      <div class="kv">状态：${d.state} · 分桶：${d.bucket}</div>
      <div class="kv">授权范围：${(d.scope || []).join("， ") || "—"}</div>
      ${d.budget ? `<div class="kv">预算：${d.budget.max_total_tokens} tokens</div>` : ""}
      ${d.report ? `<div class="kv" style="margin-top:8px"><b>报告（${d.report.state}）</b><br/>${esc(d.report.summary)}</div>` : '<div class="kv" style="margin-top:8px">尚无报告</div>'}`;
    box.style.display = "block";
    box.querySelector(".close").onclick = () => box.style.display = "none";
  } catch (e) { /* detail fetch failed; ignore */ }
}

/* demo trigger: create a secret-less source once, then post webhooks */
async function ensureDemoSource() {
  if (demoSourceId) return demoSourceId;
  const list = (await api("/sources")).items;
  const found = list.find(s => s.name === "demo-ui");
  if (found) { demoSourceId = found.sourceId; return demoSourceId; }
  const created = await api("/sources", { method: "POST",
    body: JSON.stringify({ name: "demo-ui", generate_secret: false,
      allow_actors: ["alice"], explicit_patterns: ["/polyopus"] }) });
  demoSourceId = created.sourceId;
  return demoSourceId;
}
$("sendTrigger").onclick = async () => {
  const text = $("triggerText").value.trim();
  if (!text) return;
  $("triggerMeta").textContent = "发送中…";
  try {
    const sid = await ensureDemoSource();
    const body = { external_id: "ui-" + Date.now(), thread_key: "demo",
      actor: { id: "alice", kind: "user" }, text };
    const r = await api(`/webhooks/${sid}`, { method: "POST", body: JSON.stringify(body) });
    $("triggerText").value = "";
    $("triggerMeta").textContent = r.ticketId
      ? `已建工单 ${r.ticketId.slice(0, 11)}…`
      : `触发 ${r.dedupeKey.slice(0, 12)}…（${r.disposition}）`;
    refreshTasks();
  } catch (e) { $("triggerMeta").textContent = "失败：" + (e.code || e.message); }
};

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function shortId(id) { return id ? id.slice(0, 11) + "…" : ""; }

boot();
</script>
