<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolyOpus</title>
    <script>
      // Set the theme before first paint (docs/49 §9): explicit choice wins,
      // otherwise follow the OS. data-theme is the single source for tokens.
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("poly:theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia("(prefers-color-scheme: light)").matches)
            theme = "light";
        } catch (e) {
          /* private mode: keep dark */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
