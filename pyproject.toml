[project]
name = "polyopus"
version = "0.1.0.dev0"
description = "Self-hosted multi-agent platform (design-first, M0 skeleton)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
]

[project.scripts]
poly = "polyopus.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyopus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "generated/py"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/polyopus/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["polyopus"]
mypy_path = "src"
